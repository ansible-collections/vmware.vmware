---
minor_changes:
  - vms inventory - add ``gather_path`` option (default ``true``) to omit the C(path)
    host variable when it is not needed. Path computation traverses the parent folder chain
    via pyVmomi lazy loading, which issues one synchronous vCenter RPC per folder level
    per object; setting ``gather_path`` to ``false`` saves roughly 1-2 seconds per object
    on a local network connection (https://github.com/ansible-collections/vmware.vmware/pull/XXX).
  - esxi_hosts inventory - add ``gather_path`` option (default ``true``) with the same
    semantics as the vms inventory plugin
    (https://github.com/ansible-collections/vmware.vmware/pull/XXX).
