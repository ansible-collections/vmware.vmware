---
bugfixes:
  - event_query - ``vm``, ``license_info`` and ``tag_associations`` read a key whose value is not an object (a bool, and two lists of strings), which raises a jq error. The controller catches jq errors at the event level, so each of these discarded the audit records of every other module in the same event, not just its own (https://github.com/ansible-collections/vmware.vmware/pull/413).
  - event_query - ``esxi_maintenance_mode``, ``import_content_library_ovf``, ``import_content_library_iso``, ``cluster_info``, ``tags``, ``tag_categories`` and ``vm_list_group_by_clusters_info`` read their identifier from a path the module does not populate, so ``canonical_facts`` was ``{"<key>": null}``. The controller cannot hash null and silently drops such records, so these modules never reported a node (https://github.com/ansible-collections/vmware.vmware/pull/413).
  - event_query - the module's own name was part of ``canonical_facts``, which is the only key the controller deduplicates on. One virtual machine touched by ``vm``, ``vm_powerstate``, ``vm_snapshot`` and the other VM modules was therefore counted as a separate node per module. The module name moved to ``facts`` (https://github.com/ansible-collections/vmware.vmware/pull/413).
  - event_query - ``deploy_content_library_ovf``, ``deploy_content_library_template`` and ``deploy_folder_template`` report a virtual machine, but were labelled ``content_library`` and ``folder`` (https://github.com/ansible-collections/vmware.vmware/pull/413).
minor_changes:
  - event_query - removed the entries for ``folder_template_from_vm``, ``license_info``, ``vm_portgroup_info``, ``vcsa_settings``, ``vcsa_backup_schedule`` and ``vcsa_backup_schedule_info``. None of these modules returns an identifier that can distinguish one node from another, so none of them could report a node regardless of the query used (https://github.com/ansible-collections/vmware.vmware/pull/413).
  - event_query - added ``tests/unit/audit/test_event_query_contract.py``, which asserts the constraints the controller imposes on this file (https://github.com/ansible-collections/vmware.vmware/pull/413).
