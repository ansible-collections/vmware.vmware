vmware.vmware.tag_associations:
  query: >-
    .object | select(type == "object") | select(.id != null) |
    {
      name: (.id | tostring),
      canonical_facts: {
        moid: (.id | tostring)
      },
      facts: {
        infra_type: "private_cloud",
        infra_bucket: "compute",
        device_type: (
          if   (.id | startswith("vm-"))       then "virtual_machine"
          elif (.id | startswith("host-"))     then "hypervisor_host"
          elif (.id | startswith("domain-c"))  then "compute_cluster"
          elif (.id | startswith("group-"))    then "folder"
          else "vsphere_object"
          end
        ),
        module: "tag_associations"
      }
    }

# REMOVED -- these modules return no usable node identity, so their queries
# could not report a node no matter what they were changed to. Each is listed
# with what its result actually contains. Restore any of them if the module
# starts returning an identifier.
#
# folder_template_from_vm     result is `dict(changed=...)` and nothing else.
#                             The query read `.id`, which was always null, so
#                             the record was discarded on every run.
#
# license_info                `result['licenses']` is a list of license KEY
#                             STRINGS (VcenterLicenseMgr.list_keys returns
#                             item.licenseKey). `.licenses[] | .id` indexes a
#                             string, which raises a jq error -- and the
#                             controller catches jq errors at the event level,
#                             so this discarded every other module's records
#                             for the same event. A license is also not a node.
#
# vm_portgroup_info           returns {vm_name: [portgroup, ...]}. The only
#                             identity available is the VM *name*, which is
#                             mutable and is not the moid every other query
#                             uses, so counting it would add a second row for a
#                             VM already counted correctly elsewhere.
#
# vcsa_settings               returns the appliance's DNS/NTP settings, which
#                             carry no identifier; `.vcsa_settings.id` was
#                             always null. The appliance itself is reported by
#                             appliance_info with a stable id.
#
# vcsa_backup_schedule        the schedule id is "default" on every appliance
# vcsa_backup_schedule_info   ("Your VCSA may only allow for one schedule ...
#                             its name is 'default'"), so canonical_facts was
#                             identical across every vCenter in a fleet and
#                             collapsed all of them into a single audit row.
#                             A backup schedule is also not a node.
