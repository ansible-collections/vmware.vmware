# The result is {cluster: {folder: [vm, ...]}}, so `.id` on the outer
# container was always null. Each vm entry comes from
# `{k: str(v) for k, v in vars(VM.Summary)}`, whose id field is named `vm`;
# the module's RETURN sample documents `moid` instead, so both are accepted.
# With detailed_vms=true the entries are VM.Info, which carries no id at
# all -- those runs report nothing, which is correct, because there is no
# identity to deduplicate on.
vmware.vmware.vm_list_group_by_clusters_info:
  query: >-
    .vm_list_group_by_clusters_info | .[]? | .[]? | .[]? |
    select(type == "object") | select((.vm // .moid) != null) |
    {
      name: (.name // ((.vm // .moid) | tostring)),
      canonical_facts: {
        moid: ((.vm // .moid) | tostring)
      },
      facts: {
        infra_type: "private_cloud",
        infra_bucket: "compute",
        device_type: "virtual_machine",
        module: "vm_list_group_by_clusters_info"
      }
    }
