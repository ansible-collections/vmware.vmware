---
# Indirect node counting queries for the vmware.vmware collection.
#
# These jq expressions run inside the Automation Platform controller
# (awx/main/tasks/host_indirect.py) against each module's result, and their
# output feeds subscription node counting. Nothing in this repository executes
# them, so tests/unit/audit/test_event_query_contract.py asserts the contract
# the controller imposes on the output.
#
# THE CONTRACT
# ------------
# name             must be present and never null.
#                  `if name is None: continue`
# canonical_facts  must be present, truthy, and free of null at any depth.
#                  get_hashable_form() accepts int/float/str/bool/dict/list/
#                  tuple and raises UnhashableFacts on anything else, including
#                  null; the caller catches it and skips the record. So
#                  `(.x // null)` does not make a field optional -- it discards
#                  the whole node, silently, with the job still green.
# canonical_facts  is the ONLY dedup key (`results[hashable_facts]`), so it must
#                  hold identity and nothing else. It previously carried the
#                  module's own name, which produced one audit row per module
#                  that touched a node rather than one row per node.
# facts            must carry infra_type, infra_bucket and device_type; a node
#                  without them is counted but cannot be bucketed downstream.
#
# CONVENTIONS USED BELOW
# ----------------------
# select(type == "object")   guards against a source key that is not the shape
#                            the query expects. Indexing a boolean, a string or
#                            an array raises a jq error, and the controller
#                            catches that at the *event* level -- so one bad
#                            query discards every other module's records for
#                            that event too.
# select(<id> != null)       drops a record that has no identity, instead of
#                            emitting one whose canonical_facts is null (which
#                            the controller discards anyway, but invisibly).
# canonical_facts.moid       a vSphere managed object id; the same VM, cluster
#                            or host reached through any module deduplicates to
#                            one row because every query uses the same key.
# canonical_facts.id         a vSphere Automation API uuid (libraries, items,
#                            tags, templates).

vmware.vmware.appliance_info:
  query: >-
    .appliance |select(type == "object") | select(.id != null) |
    {
      name: (.name // (.id | tostring)),
      canonical_facts: {
        id: (.id | tostring)
      },
      facts: {
        infra_type: "private_cloud",
        infra_bucket: "compute",
        device_type: "management_appliance",
        module: "appliance_info"
      }
    }
