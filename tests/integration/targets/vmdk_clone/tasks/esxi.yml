---
- name: Test on the ESXi host
  module_defaults:
    vmware.vmware.vmdk_clone:
      hostname: "{{ vmdk_clone_esxi_hostname }}"
      username: "{{ vmdk_clone_esxi_username }}"
      password: "{{ vmdk_clone_esxi_password }}"
      validate_certs: false
  block:
    - name: Convert the disk to eager zeroed thick
      vmware.vmware.vmdk_clone: &thick
        source: "{{ test_source_disk }}"
        destination: "{{ test_thick_disk }}"
        disk_format: eagerzeroedthick
      register: _thick

    - name: Convert the disk to eager zeroed thick - idempotence
      vmware.vmware.vmdk_clone: *thick
      register: _thick_idempotence

    - name: Gather information about the thick copy
      vmware.vmware.vmdk_info:
        path: "{{ test_thick_disk }}"
      register: _thick_info

    - name: Check the thick copy
      ansible.builtin.assert:
        that:
          - _thick is ansible.builtin.changed
          - _thick_idempotence is not ansible.builtin.changed
          - _thick_info.vmdk.exists
          - not _thick_info.vmdk.thin
          - _thick_info.vmdk.capacity_bytes == _source_info.vmdk.capacity_bytes

    - name: Copy the disk onto the LUN as an RDM
      when: vmdk_clone_rdm_device is defined
      block:
        - name: Copy the disk onto the LUN as an RDM - check mode
          vmware.vmware.vmdk_clone: &rdm
            source: "{{ test_source_disk }}"
            destination: "{{ test_rdm_disk }}"
            disk_format: rdm
            device: "{{ vmdk_clone_rdm_device }}"
          check_mode: true
          register: _rdm_check

        - name: Gather information about the RDM after check mode
          vmware.vmware.vmdk_info:
            path: "{{ test_rdm_disk }}"
          register: _rdm_check_info

        - name: Copy the disk onto the LUN as an RDM
          vmware.vmware.vmdk_clone: *rdm
          register: _rdm

        - name: Copy the disk onto the LUN as an RDM - idempotence
          vmware.vmware.vmdk_clone: *rdm
          register: _rdm_idempotence

        - name: Gather information about the RDM
          vmware.vmware.vmdk_info:
            path: "{{ test_rdm_disk }}"
          register: _rdm_info

        - name: Check the RDM
          ansible.builtin.assert:
            that:
              - _rdm_check is ansible.builtin.changed
              - not _rdm_check_info.vmdk.exists
              - _rdm is ansible.builtin.changed
              - _rdm_idempotence is not ansible.builtin.changed
              - _rdm_info.vmdk.exists
              - _rdm_info.vmdk.provisioning == 'rdm'
              - "'RawDiskMapping' in _rdm_info.vmdk.backing_type"
              - _rdm_info.vmdk.capacity_bytes >= _source_info.vmdk.capacity_bytes

  always:
    - name: Remove the files created on the ESXi host
      community.vmware.vsphere_file:
        hostname: "{{ vmdk_clone_esxi_hostname }}"
        username: "{{ vmdk_clone_esxi_username }}"
        password: "{{ vmdk_clone_esxi_password }}"
        validate_certs: false
        datacenter: ha-datacenter
        datastore: "{{ shared_storage_01 }}"
        path: "{{ test_vm_name }}/{{ item }}"
        state: absent
      loop:
        - thick.vmdk
        - thick-flat.vmdk
        - rdm.vmdk
        - rdm-rdm.vmdk
