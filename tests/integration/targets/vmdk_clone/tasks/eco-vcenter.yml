---
- name: Test
  environment: "{{ environment_auth_vars }}"
  block:
    - name: Create a VM with a disk to copy
      vmware.vmware.vm:
        name: "{{ test_vm_name }}"
        datacenter: "{{ vcenter_datacenter }}"
        cluster: "{{ vcenter_cluster_name }}"
        datastore: "{{ shared_storage_01 }}"
        guest_id: otherLinux64Guest
        cpu:
          cores: 1
        memory:
          size_mb: 256
        disks:
          - size: 1gb
            provisioning: thin
            device_node: SCSI(0:0)
        scsi_controllers:
          - bus_number: 0
            controller_type: lsilogic
      register: _vm

    # ---- vmdk_info ---------------------------------------------------------------------------------
    - name: Gather information about the VM disk
      vmware.vmware.vmdk_info:
        path: "{{ test_source_disk }}"
      register: _source_info

    - name: Gather information about the VM disk using an ESXi style path, in check mode
      vmware.vmware.vmdk_info:
        path: "/vmfs/volumes/{{ shared_storage_01 }}/{{ test_vm_name }}/{{ test_vm_name }}.vmdk"
      check_mode: true
      register: _source_info_vmfs_path

    - name: Gather information about a disk that does not exist
      vmware.vmware.vmdk_info:
        path: "{{ test_disk_folder }}/missing.vmdk"
      register: _missing_info

    - name: Check vmdk_info results
      ansible.builtin.assert:
        that:
          - _source_info is not ansible.builtin.changed
          - _source_info.vmdk.exists
          - _source_info.vmdk.path == test_source_disk
          - _source_info.vmdk.datastore.name == shared_storage_01
          - _source_info.vmdk.provisioning == 'thin'
          - _source_info.vmdk.capacity_bytes == 1073741824
          - _source_info.vmdk.uuid | length > 0
          - _source_info.vmdk.attached_to | length == 1
          - _source_info.vmdk.attached_to[0].vm.moid == _vm.vm.moid
          - _source_info_vmfs_path is not ansible.builtin.changed
          - _source_info_vmfs_path.vmdk.path == test_source_disk
          - _missing_info is not ansible.builtin.changed
          - not _missing_info.vmdk.exists

    # ---- vmdk_clone through vCenter ------------------------------------------------------------------
    - name: Copy the disk - check mode
      vmware.vmware.vmdk_clone: &copy
        source: "{{ test_source_disk }}"
        destination: "{{ test_copy_disk }}"
      check_mode: true
      register: _copy_check

    - name: Gather information about the copy after check mode
      vmware.vmware.vmdk_info:
        path: "{{ test_copy_disk }}"
      register: _copy_check_info

    - name: Check that check mode did not copy the disk
      ansible.builtin.assert:
        that:
          - _copy_check is ansible.builtin.changed
          - not _copy_check_info.vmdk.exists

    - name: Copy the disk
      vmware.vmware.vmdk_clone: *copy
      register: _copy

    - name: Gather information about the copy
      vmware.vmware.vmdk_info:
        path: "{{ test_copy_disk }}"
      register: _copy_info

    - name: Copy the disk - idempotence
      vmware.vmware.vmdk_clone: *copy
      register: _copy_idempotence

    - name: Check the copy
      ansible.builtin.assert:
        that:
          - _copy is ansible.builtin.changed
          - _copy.source.path == test_source_disk
          - _copy.destination.exists
          - _copy_info.vmdk.exists
          - _copy_info.vmdk.provisioning == 'thin'
          - _copy_info.vmdk.capacity_bytes == _source_info.vmdk.capacity_bytes
          - _copy_info.vmdk.attached_to | length == 0
          - _copy_idempotence is not ansible.builtin.changed

    - name: Replace the copy
      vmware.vmware.vmdk_clone:
        <<: *copy
        force: true
      register: _copy_force

    - name: Gather information about the replaced copy
      vmware.vmware.vmdk_info:
        path: "{{ test_copy_disk }}"
      register: _copy_force_info

    - name: Check the replaced copy
      ansible.builtin.assert:
        that:
          - _copy_force is ansible.builtin.changed
          - _copy_force_info.vmdk.exists
          - _copy_force_info.vmdk.uuid != _copy_info.vmdk.uuid

    - name: Convert the format through vCenter
      vmware.vmware.vmdk_clone:
        source: "{{ test_source_disk }}"
        destination: "{{ test_disk_folder }}/converted.vmdk"
        disk_format: eagerzeroedthick
      register: _convert
      ignore_errors: true

    - name: Copy into a folder that does not exist
      vmware.vmware.vmdk_clone:
        source: "{{ test_source_disk }}"
        destination: "{{ test_disk_folder }}/missing/copy.vmdk"
      register: _missing_folder
      ignore_errors: true

    - name: Gather information about the files that must not exist
      vmware.vmware.vmdk_info:
        path: "{{ item }}"
      loop:
        - "{{ test_disk_folder }}/converted.vmdk"
        - "{{ test_disk_folder }}/missing/copy.vmdk"
      register: _not_created

    - name: Check the refused copies
      ansible.builtin.assert:
        that:
          - _convert is ansible.builtin.failed
          - "'needs a connection to an ESXi host' in _convert.msg"
          - _missing_folder is ansible.builtin.failed
          - "'create_folders' in _missing_folder.msg"
          - _not_created.results | map(attribute='vmdk.exists') | select | length == 0

    - name: Test format conversions on an ESXi host
      ansible.builtin.include_tasks: esxi.yml
      when: vmdk_clone_esxi_hostname is defined

  always:
    # Destroying the VM deletes every disk attached to it, so attach the copy first.
    - name: Look up the copy
      vmware.vmware.vmdk_info:
        path: "{{ test_copy_disk }}"
      register: _cleanup_copy
      ignore_errors: true

    - name: Attach the copy to the VM so that it is deleted with it
      community.vmware.vmware_guest_disk:
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ test_vm_name }}"
        disk:
          - filename: "{{ test_copy_disk }}"
            scsi_controller: 0
            scsi_type: lsilogic
            unit_number: 1
            state: present
      when: _cleanup_copy.vmdk.exists | default(false)
      ignore_errors: true

    - name: Destroy the VM
      vmware.vmware.vm:
        name: "{{ test_vm_name }}"
        datacenter: "{{ vcenter_datacenter }}"
        state: absent
