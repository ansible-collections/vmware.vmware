---
- name: Get info on templates
  vmware.vmware.vm_info:
    datacenter: "{{ vcenter_datacenter }}"
    folder: "{{ item }}"
    name: "{{ template_name }}"
  register: template_info

- name: Check template
  ansible.builtin.assert:
    that:
      - template_info.vms | length == 1
      - template_info.vms[0].hw_folder == "/" + vcenter_datacenter + "/vm/" + item
      - template_info.vms[0].hw_is_template == true
      - template_info.vms[0].hw_name == template_name
