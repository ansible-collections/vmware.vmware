---
vm_folder: test_folder
vm_name: DC0_H0_VM0

template_folders:
  - "{{ tiny_prefix }}_folder_1"
  - "{{ tiny_prefix }}_folder_2"
vm_name_match: first
template_name: "{{ vm_name }}_template"

vm_guest_id: "rhel8_64Guest"
vm_disks:
  - size: 10gb
    provisioning: thin
    device_node: SCSI(0:0)
vm_scsi_controllers:
  - controller_type: paravirtual
    bus_number: 0
vm_cpu:
  cores: 2
vm_memory:
  size_mb: 2000
vm_options:
  boot_firmware: efi
