---
- name: Test
  environment: "{{ environment_auth_vars }}"
  when: run_on_vcenter
  block:
    - name: Gather host info
      vmware.vmware.esxi_info:
        datacenter: "{{ vcenter_datacenter }}"
      register: __res

    - name: Assert values
      ansible.builtin.assert:
        that:
          - __res.changed == False
          - __res.hosts | length > 5
