---
vm: DC0_H0_VM0
template_host: 1.2.3.4.
library: templates
template_name: mytemplate

vm_cluster: "{{ vcenter_cluster_name }}"
vm_datacenter: "{{ vcenter_datacenter }}"
vm_folder: "/{{ vcenter_datacenter }}/vm"
vm_guest_id: "rhel8_64Guest"
vm_disks:
  - size: 10gb
    provisioning: thin
    device_node: SCSI(0:0)
vm_scsi_controllers:
  - controller_type: paravirtual
    bus_number: 0
vm_cpu:
  cores: 2
vm_memory:
  size_mb: 2000
vm_options:
  boot_firmware: efi

datastore: "{{ shared_storage_01 }}"
