---
# These tests cover the basics of check mode. The other test files exercise the
# many available options, and we do not need to repeat those in check mode.
- name: Create VM (check mode)
  vmware.vmware.vm:
    name: "{{ test_vm_name }}-check-mode"
    datacenter: "{{ vcenter_datacenter }}"
    cluster: "{{ vcenter_cluster_name }}"
    datastore: "{{ shared_storage_01 }}"
    guest_id: amazonlinux3_64Guest
    cpu:
      cores: 2
    memory:
      size_mb: 1024
    disks:
      - size: 10gb
        provisioning: thin
        device_node: SCSI(0:0)
    scsi_controllers:
      - bus_number: 0
        controller_type: paravirtual
  check_mode: true
  register: _check_mode_create

- name: Lookup VM that should not have been created
  vmware.vmware.vm_info:
    name: "{{ test_vm_name }}-check-mode"
  register: _check_mode_create_lookup

- name: Check that check mode create reported a change but created nothing
  ansible.builtin.assert:
    that:
      - _check_mode_create is ansible.builtin.changed
      - _check_mode_create_lookup.guests | length == 0

- name: Update VM (check mode)
  vmware.vmware.vm:
    name: "{{ test_vm_name }}"
    guest_id: amazonlinux3_64Guest
    memory:
      size_mb: 2048
  check_mode: true
  register: _check_mode_update

- name: Lookup VM that should not have been updated
  vmware.vmware.vm_info:
    moid: "{{ test_vm_moid }}"
  register: _check_mode_update_lookup

- name: Check that check mode update reported a change but changed nothing
  ansible.builtin.assert:
    that:
      - _check_mode_update is ansible.builtin.changed
      - _check_mode_update.changes.changed_parameters['memory.size_mb'] is defined
      - _check_mode_update_lookup.guests[0].hw_memtotal_mb == 1024

- name: Delete VM (check mode)
  vmware.vmware.vm:
    moid: "{{ test_vm_moid }}"
    state: absent
  check_mode: true
  register: _check_mode_delete

- name: Lookup VM that should not have been deleted
  vmware.vmware.vm_info:
    moid: "{{ test_vm_moid }}"
  register: _check_mode_delete_lookup

- name: Check that check mode delete reported a change but deleted nothing
  ansible.builtin.assert:
    that:
      - _check_mode_delete is ansible.builtin.changed
      - _check_mode_delete_lookup.guests | length == 1
      - _check_mode_delete_lookup.guests[0].moid == test_vm_moid
