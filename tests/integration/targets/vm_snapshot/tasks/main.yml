---
- name: Test
  environment: "{{ environment_auth_vars }}"

  block:
    - name: Create Virtual Machine From OVF Template
      vmware.vmware.deploy_content_library_ovf:
        library_item_name: "{{ rhel9_content_library_ovf }}"
        vm_name: "{{ vm }}"
        datacenter: "{{ vm_datacenter }}"
        datastore: "{{ datastore }}"
        cluster: "{{ vm_cluster }}"

    - name: Create a snapshot
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: present
        snapshot_name: snap1
        description: snap1_description
      register: _create

    - name: Create a snapshot - Idempotence
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: present
        snapshot_name: snap1
        description: snap1_description
      register: _create_idem

    - name: Gather some info from vm
      vmware.vmware.guest_info:
        name: "{{ vm }}"
      register: info

    - name: Verify snapshot created
      ansible.builtin.assert:
        that:
          - snapshot_info.name == 'snap1'
          - snapshot_info.name == _create.snapshot.name
          - snapshot_info.id == _create.snapshot.id
          - snapshot_info.description == 'snap1_description'
          - _create_idem is not changed
      vars:
        snapshot_info: "{{ info.guests[0].snapshots[0] }}"

    - name: Gather all snapshot info with the info module
      vmware.vmware.vm_snapshot_info:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
      register: _snap_info_all

    - name: Gather info about a single snapshot by name
      vmware.vmware.vm_snapshot_info:
        moid: "{{ _create.vm.moid }}"
        snapshot_name: snap1
      register: _snap_info_by_name

    - name: Gather info about a single snapshot by id
      vmware.vmware.vm_snapshot_info:
        moid: "{{ _create.vm.moid }}"
        snapshot_id: "{{ _create.snapshot.id }}"
      register: _snap_info_by_id

    - name: Verify info module reports the snapshot
      ansible.builtin.assert:
        that:
          - _snap_info_all.vm.moid == _create.vm.moid
          - _snap_info_all.snapshots | length == 1
          - _snap_info_all.snapshots[0].name == 'snap1'
          - _snap_info_all.snapshots[0].description == 'snap1_description'
          - _snap_info_all.snapshots[0].parent_id is none
          - _snap_info_all.current_snapshot.name == 'snap1'
          # snapshots_tree is keyed by snapshot id, rendered as a string once serialized to JSON
          - _snap_info_all.snapshots_tree[_create.snapshot.id | string].name == 'snap1'
          - _snap_info_by_name.snapshots | length == 1
          - _snap_info_by_name.snapshots[0].id == _create.snapshot.id
          - _snap_info_by_id.snapshots | length == 1
          - _snap_info_by_id.snapshots[0].name == 'snap1'

    - name: Create a second snapshot
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: present
        snapshot_name: snap1_2

    - name: Revert VM to first snapshot
      vmware.vmware.vm_snapshot_revert:
        moid: "{{ _create.vm.moid }}"
        snapshot_name: snap1
      register: _revert

    - name: Remove unused snapshot
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        snapshot_name: snap1_2
        state: absent

    # Renaming a snapshot must not touch its description. Note that no description is passed
    # here: previously the module always sent an empty description alongside the new name,
    # which wiped the existing description.
    - name: Rename Snapshot without changing its description
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: present
        snapshot_name: snap1
        new_snapshot_name: new_name1
      register: _rename

    - name: Rename Snapshot - Idempotence
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: present
        snapshot_name: new_name1
      register: _rename_idem

    - name: Gather snapshot info after rename
      vmware.vmware.vm_snapshot_info:
        moid: "{{ _create.vm.moid }}"
        snapshot_name: new_name1
      register: _snap_info_renamed

    - name: Verify snapshot renamed and description preserved
      ansible.builtin.assert:
        that:
          - _rename is ansible.builtin.changed
          - _rename.renamed
          - _rename_idem is not changed
          - _snap_info_renamed.snapshots | length == 1
          - _snap_info_renamed.snapshots[0].name == 'new_name1'
          # The bug: renaming without a description used to reset the description to an empty string
          - _snap_info_renamed.snapshots[0].description == 'snap1_description'
          - _revert is ansible.builtin.changed
          - _revert.snapshot.id == _snap_info_renamed.current_snapshot.id

    # The inverse of the rename case: updating the description must not touch the name.
    - name: Update snapshot description without renaming
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: present
        snapshot_name: new_name1
        description: updated_description
      register: _redescribe

    - name: Gather snapshot info after description update
      vmware.vmware.vm_snapshot_info:
        moid: "{{ _create.vm.moid }}"
        snapshot_name: new_name1
      register: _snap_info_redescribed

    - name: Verify description updated and name preserved
      ansible.builtin.assert:
        that:
          - _redescribe is ansible.builtin.changed
          - _snap_info_redescribed.snapshots[0].name == 'new_name1'
          - _snap_info_redescribed.snapshots[0].description == 'updated_description'

    - name: Take a second snap with more options
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: present
        snapshot_name: snap02
        quiesce: true
        memory_dump: true

    - name: Take even more snaps
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: present
        snapshot_name: snap0{{ item }}
      loop:
        - 3
        - 4
        - 5
        - 6

    - name: Gather some info from vm
      vmware.vmware.guest_info:
        name: "{{ vm }}"
      register: info

    - name: Gather all snapshot info with the info module
      vmware.vmware.vm_snapshot_info:
        moid: "{{ _create.vm.moid }}"
      register: _snap_info_chain

    - name: Verify snapshot length
      ansible.builtin.assert:
        that:
          - info.guests[0].snapshots | length == 6
          # The info module reports the same set of snapshots as guest_info
          - _snap_info_chain.snapshots | length == 6
          - _snap_info_chain.current_snapshot != {}
          - _snap_info_chain.snapshots_tree | length > 0
          # Every flattened snapshot exposes the tree-walking metadata keys
          - _snap_info_chain.snapshots | map(attribute='parent_id') | list | length == 6
          - _snap_info_chain.snapshots[0].child_ids is defined

    - name: Remove a single snapshot
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: absent
        snapshot_name: snap06
      register: _rm_single

    - name: Remove a snapshot - Idemptoence
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: absent
        snapshot_name: snap06
      register: _rm_single_idem

    - name: Gather some info from vm
      vmware.vmware.guest_info:
        name: "{{ vm }}"
      register: info

    - name: Verify snapshot length
      ansible.builtin.assert:
        that:
          - info.guests[0].snapshots | length == 5
          - _rm_single_idem is not changed

    - name: Remove a snapshot and snapshot subtree
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: absent
        remove_children: true
        snapshot_name: snap04

    - name: Gather some info from vm
      vmware.vmware.guest_info:
        name: "{{ vm }}"
      register: info

    - name: Verify snapshot length
      ansible.builtin.assert:
        that:
          - info.guests[0].snapshots | length == 3
          - _rm_single_idem is not changed

    - name: Remove all snapshots of a VM
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: absent
        remove_all: True

    - name: Gather some info from vm
      vmware.vmware.guest_info:
        name: "{{ vm }}"
      register: info

    - name: Gather snapshot info when the VM has no snapshots
      vmware.vmware.vm_snapshot_info:
        moid: "{{ _create.vm.moid }}"
      register: _snap_info_empty

    - name: Verify all snapshots removed
      ansible.builtin.assert:
        that:
          - info.guests[0].snapshots | length == 0
          - _snap_info_empty.snapshots | length == 0
          - _snap_info_empty.snapshots_tree == {}
          - _snap_info_empty.current_snapshot == {}

    - name: Create a snapshot
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        state: present
        snapshot_name: snap1
        description: snap1_description
      register: _create

    - name: Remove a snapshot with a snapshot id
      vmware.vmware.vm_snapshot:
        datacenter: "{{ vm_datacenter }}"
        folder: "/{{ vm_datacenter }}/vm/"
        name: "{{ vm }}"
        snapshot_id: "{{ _create.snapshot.id }}"
        state: absent

    - name: Gather some info from vm
      vmware.vmware.guest_info:
        name: "{{ vm }}"
      register: info

    - name: Verify all snapshots removed
      ansible.builtin.assert:
        that:
          - info.guests[0].snapshots | length == 0

  always:
    - name: "Test teardown: Destroy VM guest {{ vm }}"
      community.vmware.vmware_guest:
        cluster: "{{ vm_cluster }}"
        datacenter: "{{ vm_datacenter }}"
        state: absent
        force: true
        name: "{{ vm }}"
