---
- name: Include Test Vars
  ansible.builtin.include_vars:
    file: vcenter_vars.yml

# This file does not exist for AAP, its variables come from an inventory file.
# It is needed for eco-vcenter-ci tests, and if its missing the tiny prefix
# check will fail.
- name: Import integration_config.yml
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../integration_config.yml"
  ignore_errors: true
  no_log: true

- name: Generate a unique tiny_prefix when one was not provided
  ansible.builtin.set_fact:
    # Namespaces every resource created during a test run so concurrent runs
    # against the shared vCenter do not collide. Override by defining
    # tiny_prefix in integration_config.yml (loaded above).
    tiny_prefix: "test-vmware-{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_lowercase length=4') }}"
  when: tiny_prefix is not defined or (tiny_prefix | length) == 0

- name: Set auth vars for later
  ansible.builtin.set_fact:
    # these should be exposed to modules using module_defaults or direct task parameters.
    # Do not expose as ENV vars, since these can be leaked
    vmware_rest_auth_vars:
      vcenter_hostname: "{{ vcenter_hostname }}"
      vcenter_username: "{{ vcenter_username }}"
      vcenter_password: "{{ vcenter_password }}"
      vcenter_validate_certs: false

    vmware_auth_vars:
      hostname: "{{ vcenter_hostname }}"
      username: "{{ vcenter_username }}"
      password: "{{ vcenter_password }}"
      validate_certs: false
      port: "{{ vcenter_port }}"
  no_log: true
